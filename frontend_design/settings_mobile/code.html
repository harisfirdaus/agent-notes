<button class="p-xs text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</div>
</header>
<main class="pb-24 pt-4 px-md max-w-md mx-auto">

</a>
<a class="flex items-center justify-between p-md bg-surface-container-lowest rounded-xl border border-transparent hover:border-outline-variant transition-all duration-200" href="#">
<div class="flex items-center gap-md">

<span class="font-body-md">Agent Access</span>
</div>

<a class="flex items-center justify-between p-md bg-surface-container-lowest rounded-xl border border-transparent hover:border-outline-variant transition-all duration-200" href="#">

<button class="flex flex-col items-center justify-center text-on-surface-variant transition-transform duration-100 active:scale-90">
<span class="material-symbols-outlined" data-icon="label">label</span>

</button>
<!-- ACTIVE STATE: Settings -->
<button class="flex flex-col items-center justify-center text-primary font-bold transition-transform duration-100 active:scale-90">
<span class="material-symbols-outlined fill-icon" data-icon="settings" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</button>

<script>
        // Micro-interaction for list items
        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('touchstart', () => {
                el.classList.add('opacity-80');
            });
            el.addEventListener('touchend', () => {
                el.classList.remove('opacity-80');
            });
        });
    </script>
